<svg fill="none" viewBox="0 0 850 400" width="100%" height="400" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        :root {
          --bg: #ffffff;
          --surface-1: #f5f4f0;
          --surface-2: #ffffff;
          --border: rgba(0,0,0,0.12);
          --text-primary: #1a1a1a;
          --text-secondary: #55554f;
          --text-muted: #8a897f;
          --accent: #185fa5;
          --radius: 10px;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #17171a;
            --surface-1: #202024;
            --surface-2: #26262b;
            --border: rgba(255,255,255,0.14);
            --text-primary: #f0f0ee;
            --text-secondary: #b6b5ad;
            --text-muted: #86857c;
            --accent: #85b7eb;
          }
        }
        * { box-sizing: border-box; }
        .wrap { 
          padding: 1.5rem; 
          background: var(--bg); 
          color: var(--text-primary);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
          border-radius: var(--radius);
          border: 1px solid var(--border);
        }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
        .sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 16px; }
        .nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .node { padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); }
        .node .name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
        .node .desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        footer { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
      </style>

      <div class="wrap">
        <h1>Agentic AI Threat Explorer</h1>
        <p class="sub">Filter by pipeline stage, browse by domain. Generated as a static reference.</p>
        
        

        <footer>27 threats across 9 domains and 4 pipeline stages.</footer>
      </div>
    </div>
  </foreignObject>
</svg>
