<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; border-radius: 6px;">
      <style>
        :root {
          --bg: #ffffff;
          --surface-1: #f5f4f0;
          --surface-2: #ffffff;
          --border: rgba(0,0,0,0.12);
          --text-primary: #1a1a1a;
          --text-secondary: #55554f;
          --text-muted: #8a897f;
          --accent: #185fa5;
          --radius: 10px;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #17171a;
            --surface-1: #202024;
            --surface-2: #26262b;
            --border: rgba(255,255,255,0.14);
            --text-primary: #f0f0ee;
            --text-secondary: #b6b5ad;
            --text-muted: #86857c;
            --accent: #85b7eb;
          }
        }
        * { box-sizing: border-box; }
        .wrap { 
          padding: 1.5rem; 
          background: var(--bg); 
          color: var(--text-primary);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
          border-radius: var(--radius);
          border: 1px solid var(--border);
        }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
        .sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 16px; }
        .nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .node { padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); }
        .node .name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
        .node .desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        footer { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
      </style>
div class="wrap">
  <h1>Agentic AI threat explorer</h1>
  <div class="article-image-container">
  <img src="threat-explorer/SATF-Agent_Threats_Flow.png" alt="Agentic AI Threat explorer">
</div>
     <div><h2>Agentic AI pipeline Stages</h2><img src="threat-explorer/agentic_pipeline_threat_stages.svg" alt="Agentic AI pipeline Stages"></div> 
<p class="sub"><b>Filter by pipeline stage, browse by domain. Generated as a static reference — severity/likelihood tagging planned for a future iteration.</b></p>
  
  <div id="stages" class="stagebar"></div>
  <div id="nodes" class="nodes"></div>
  <div id="detail" class="detail"></div>

  <footer>27 threats across 9 domains and 4 pipeline stages. </footer>
</div>


      
    </div>
  </foreignObject>
</svg>
